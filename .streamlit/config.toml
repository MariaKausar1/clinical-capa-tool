[theme]
# A bold, authoritative royal navy for buttons and highlights
primaryColor = "#1a365d"

# A very soft, cool clinical gray/blue for the main background
backgroundColor = "#f0f4f8"

# Pure white for the sidebar and input boxes so they pop cleanly off the background
secondaryBackgroundColor = "#ffffff"

# A deep slate (softer than pure black) for highly readable, elegant text
textColor = "#2c3e50"

# Clean, modern sans-serif font
font = "sans serif"
