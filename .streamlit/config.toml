[theme]
# A vibrant, professional blue for buttons to pop against the dark UI
primaryColor = "#3b82f6"

# A deep, sophisticated dark slate background (highly attractive and easy on the eyes)
backgroundColor = "#0f172a"

# A slightly lighter dark slate for input boxes and the sidebar to create depth
secondaryBackgroundColor = "#1e293b"

# Crisp off-white text for perfect readability
textColor = "#f8fafc"

# Clean, modern font
font = "sans serif"
